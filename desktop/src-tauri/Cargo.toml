[package]
name = "forgecart-code-desktop"
version = "0.1.0"
description = "Native window wrapper around code.forgecart.com"
authors = ["forgecart"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "forgecart_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
