name: Build :dev variant · sandboxed.sh

# Builds Dockerfile.dev (dev-mode overlay on :latest — runs Next.js via
# `next dev` from full source instead of the standalone bundle) and pushes
# `:dev` to Nexus. Manual-only because we don't want every master push to
# regenerate a +500 MB image; we want :dev refreshed on demand when the
# operator wants to debug the live UI with full HMR + source maps + the
# error overlay.
#
# Trigger:
#   gh workflow run "Build :dev variant · sandboxed.sh"
#
# After build, the operator runs:
#   kubectl -n sandboxed-sh set image deploy/sandboxed-sh \
#     sandboxed-sh=registry.forgecart.com/forgecart/sandboxed-sh:dev
# to swap. To revert, set image back to :latest.

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: Roll the dev image to the live deployment after build
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXUS_REGISTRY: nexus.nexus.svc.cluster.local:8087
  PUBLIC_REGISTRY: registry.forgecart.com
  IMAGE_NAME: forgecart/sandboxed-sh
  TARGET_NAMESPACE: sandboxed-sh
  TARGET_DEPLOYMENT: sandboxed-sh
  TARGET_CONTAINER: sandboxed-sh

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish :dev
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
        with:
          driver: remote
          endpoint: tcp://buildkit.arc-runners.svc.cluster.local:1234

      - name: Login to Nexus Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push :dev
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23  # v6.19.0
        with:
          context: .
          file: Dockerfile.dev
          push: true
          network: host
          build-args: |
            BASE_IMAGE=${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          tags: ${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          cache-from: type=registry,ref=${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev
          cache-to: type=registry,ref=${{ env.NEXUS_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-dev,mode=max
          outputs: type=image,push=true,compression=zstd,force-compression=true

  deploy:
    name: Rollout :dev to live deployment
    needs: build
    if: ${{ inputs.rollout }}
    runs-on: arc-runner-set
    steps:
      - name: Install kubectl
        run: |
          curl -sSL -o /tmp/kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl
          /tmp/kubectl version --client

      - name: Set image to :dev
        run: |
          /tmp/kubectl -n ${{ env.TARGET_NAMESPACE }} set image \
            deploy/${{ env.TARGET_DEPLOYMENT }} \
            ${{ env.TARGET_CONTAINER }}=${{ env.PUBLIC_REGISTRY }}/${{ env.IMAGE_NAME }}:dev

      - name: Wait for rollout
        run: |
          /tmp/kubectl -n ${{ env.TARGET_NAMESPACE }} rollout status \
            deploy/${{ env.TARGET_DEPLOYMENT }} --timeout=180s
