name: Build & Publish · sandboxed.sh

# Builds the multi-stage Dockerfile, pushes to ForgeCart's Nexus registry
# at nexus.nexus.svc.cluster.local:8087, rolls out the image to the
# `sandboxed-sh` deployment in the workload cluster, and posts a status
# embed to Discord. Runs on the forgecart Actions Runner Controller pool
# (`arc-runner-set`) inside the cluster — that's why the BuildKit endpoint,
# Nexus URL, kubectl API access, and runner label all use cluster-internal
# DNS / the in-pod service account.
#
# Tags produced:
#   sha-<short>  — every build, rolled to the live deployment.
#   latest       — only on master.
#
# Mirrors the build → deploy → notify shape of forgecart/shop-beta's
# `dev-deploy.yml` (kubectl install from Nexus, `kubectl set image`,
# `kubectl wait`, Discord embed).

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "Dockerfile.dev"
      - "docker/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dashboard/**"
      - ".github/actions/docker-build/**"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:
    inputs:
      cache-write:
        description: Export build cache to Nexus :buildcache
        required: false
        type: boolean
        default: true
      skip-deploy:
        description: Skip the kubectl rollout step (build/push only)
        required: false
        type: boolean
        default: false

concurrency:
  # Master builds queue (don't cancel-in-progress) so we never push an
  # older commit's image on top of a newer one's :latest, and never roll
  # a stale image to the cluster mid-rollout.
  group: build-and-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXUS_REGISTRY: nexus.nexus.svc.cluster.local:8087
  PUBLIC_REGISTRY: registry.forgecart.com
  TARGET_NAMESPACE: sandboxed-sh
  TARGET_DEPLOYMENT: sandboxed-sh
  TARGET_CONTAINER: sandboxed-sh

jobs:
  build:
    name: Build & Publish Image
    runs-on: arc-runner-set
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - id: sha
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/docker-build
        with:
          image-name: forgecart/sandboxed-sh
          dockerfile: Dockerfile
          context: .
          push: "true"
          cache-write: ${{ inputs.cache-write == false && 'false' || 'true' }}
          nexus-registry: ${{ env.NEXUS_REGISTRY }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

  # Workspace-base image. Every `workspace_type: k8s_pod` workspace pod
  # uses this image as its rootfs. Pulled at workspace-creation time by
  # the control plane; not rolled to any deployment (workspaces are
  # ephemeral). Built in parallel to the main image — both share the
  # same BuildKit cache layer in Nexus :buildcache.
  build-workspace-base:
    name: Build & Publish Workspace Base
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/docker-build
        with:
          image-name: forgecart/sandboxed-workspace-base
          dockerfile: docker/workspace-base/Dockerfile
          context: .
          push: "true"
          cache-write: ${{ inputs.cache-write == false && 'false' || 'true' }}
          nexus-registry: ${{ env.NEXUS_REGISTRY }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

  # Dev-mode overlay image. Layers full dashboard source + node_modules
  # on top of :latest and swaps the entrypoint so the dashboard runs
  # `next dev` (HMR + error overlay + original file paths in DevTools)
  # instead of the standalone bundle. Single-tenant deploy, so the
  # dev-mode CPU/memory overhead is acceptable in exchange for the
  # debug ergonomics. Tag: `:dev`. Depends on `build` because Dockerfile.dev
  # uses :latest as BASE_IMAGE.
  build-dev:
    name: Build & Publish :dev (next dev variant)
    needs: build
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
        with:
          driver: remote
          endpoint: tcp://buildkit.arc-runners.svc.cluster.local:1234

      - name: Login to Nexus Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push :dev
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23  # v6.19.0
        with:
          context: .
          file: Dockerfile.dev
          push: true
          network: host
          build-args: |
            BASE_IMAGE=${{ env.NEXUS_REGISTRY }}/forgecart/sandboxed-sh:latest
          tags: ${{ env.NEXUS_REGISTRY }}/forgecart/sandboxed-sh:dev
          cache-from: type=registry,ref=${{ env.NEXUS_REGISTRY }}/forgecart/sandboxed-sh:buildcache-dev
          cache-to: ${{ inputs.cache-write == false && '' || format('type=registry,ref={0}/forgecart/sandboxed-sh:buildcache-dev,mode=max', env.NEXUS_REGISTRY) }}
          outputs: type=image,push=true,compression=zstd,force-compression=true

  # Roll the freshly-built :dev image to the live deployment. Mirrors
  # the deploy-test-server / deploy-dev stages from shop-beta's
  # dev-deploy.yml. The ARC runner pod's service account talks to
  # the cluster via the in-pod kubernetes.default token — no
  # kubeconfig is needed.
  #
  # Why :dev (not :sha-<short>): the dashboard is a single-tenant
  # admin UI and the operator wants permanent dev-mode ergonomics
  # (HMR, error overlay, original file paths). :latest is still
  # built as a production-shaped image for backup/emergency rollback;
  # to switch back: `kubectl set image ... =:latest`.
  deploy:
    name: Roll :dev to Cluster
    needs: [build, build-dev]
    if: ${{ inputs.skip-deploy != true }}
    runs-on: arc-runner-set
    env:
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
    steps:
      - name: Install kubectl
        run: |
          curl -LO "http://nexus.nexus.svc.cluster.local:8081/repository/raw-proxy-k8s/release/$(curl -L -s http://nexus.nexus.svc.cluster.local:8081/repository/raw-proxy-k8s/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Roll image
        run: |
          kubectl set image deployment/${{ env.TARGET_DEPLOYMENT }} \
            ${{ env.TARGET_CONTAINER }}=${{ env.PUBLIC_REGISTRY }}/forgecart/sandboxed-sh:dev \
            -n ${{ env.TARGET_NAMESPACE }}
          # Trigger a fresh pull even though the tag is unchanged — Kubernetes
          # caches by tag, and :dev now points at a new digest.
          kubectl rollout restart deployment/${{ env.TARGET_DEPLOYMENT }} \
            -n ${{ env.TARGET_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.TARGET_DEPLOYMENT }} \
            -n ${{ env.TARGET_NAMESPACE }} \
            --timeout=600s

  # Post the build + deploy outcome to Discord. `if: always()` so failures
  # also notify. Channel + bot token come from org secrets (same ones
  # shop-beta uses). Mirrors notify-test-results / deploy-dev's embed.
  notify:
    name: Notify Discord
    needs: [build, deploy]
    if: always()
    runs-on: arc-runner-set
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
    steps:
      - name: Post status to Discord
        if: ${{ env.DISCORD_BOT_TOKEN != '' && env.DISCORD_CHANNEL_ID != '' }}
        run: |
          SE() { case "$1" in success) echo "✅" ;; skipped) echo "⏭️" ;; *) echo "❌" ;; esac; }
          ALL_GOOD="false"
          if [ "$BUILD_RESULT" = "success" ] && { [ "$DEPLOY_RESULT" = "success" ] || [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            ALL_GOOD="true"
          fi
          COLOR=$([ "$ALL_GOOD" = "true" ] && echo 3066993 || echo 15158332)
          TITLE="sandboxed.sh — \`${SHORT_SHA}\`"
          DESC=$([ "$ALL_GOOD" = "true" ] \
            && echo "**Build & deploy succeeded** on \`${{ github.ref_name }}\`\n\n> Triggered by **@${{ github.actor }}**" \
            || echo "**Build or deploy failed** on \`${{ github.ref_name }}\` — see GitHub run for details\n\n> Triggered by **@${{ github.actor }}**")
          curl -fsSL -H "Content-Type: application/json" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TITLE}\",
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": ${COLOR},
                \"description\": \"${DESC}\",
                \"fields\": [
                  {\"name\": \"Build\",  \"value\": \"$(SE $BUILD_RESULT) ${BUILD_RESULT}\",  \"inline\": true},
                  {\"name\": \"Deploy\", \"value\": \"$(SE $DEPLOY_RESULT) ${DEPLOY_RESULT}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"${{ github.repository }} • build-and-publish\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages"
